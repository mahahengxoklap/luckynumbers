<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ເກມທາຍຕົວເລກ - Lucky Numbers</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-2xl max-w-md w-full">
        <h1 class="text-2xl font-bold text-center mb-1 text-yellow-400">🎲 ເກມທາຍຕົວເລກ 🎲</h1>
        <p class="text-xs text-center text-slate-400 mb-6">ເລືອກເລກໄດ້ສູງສຸດ 9 ໂຕ, ເລືອກຄູ່/ຄີ່ ຫຼື ສູງ/ຕ່ຳ ໄດ້!</p>

        <!-- ຂໍ້ມູນຢູເຊີ ແລະ ເຄຣດິດ -->
        <div class="bg-slate-900 p-4 rounded-xl mb-4 flex justify-between items-center border border-slate-700">
            <div>
                <p class="text-xs text-slate-400">ເບີໂທລະສັບ:</p>
                <p id="userPhoneDisplay" class="text-emerald-400 font-bold text-lg">-</p>
            </div>
            <div class="text-right">
                <p class="text-xs text-slate-400">ເຄຣດິດคงເຫຼືອ:</p>
                <p id="userCredit" class="text-yellow-400 font-bold text-xl">0 ₭</p>
            </div>
        </div>

        <!-- ຟອມເຂົ້າສູ່ລະບົບ -->
        <div id="loginSection" class="mb-6">
            <label class="block text-sm text-slate-300 mb-1">ປ້ອນເບີໂທເພື່ອເຂົ້າສູ່ລະບົບ:</label>
            <div class="flex gap-2">
                <input type="text" id="phoneInput" placeholder="ຕົວຢ່າງ: 2099123456" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-yellow-400">
                <button onclick="loginUser()" class="bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-bold px-4 py-2 rounded-lg transition">ເຂົ້າສູ່ລະບົບ</button>
            </div>
        </div>

        <!-- ເກມ (ເຊື່ອງໄວ້ກ່ອນ ຖ້າບໍ່ທັນ Լ็อกอิน) -->
        <div id="gameSection" class="hidden">
            
            <!-- ເລືອກໂໝດ -->
            <div class="mb-4">
                <label class="block text-sm text-slate-300 mb-2">ເລືອກປະເພດການທາຍ:</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setMode('number')" id="modeNumBtn" class="bg-yellow-500 text-slate-950 font-bold py-2 rounded-lg text-sm transition">🔢 ຕິກເລືອກເລກ (0-9)</button>
                    <button onclick="setMode('special')" id="modeSpecBtn" class="bg-slate-700 text-slate-300 font-bold py-2 rounded-lg text-sm transition">⚡ ໂໝດ ໄຮ້ສາດ (ຄູ່/ສູງ)</button>
                </div>
            </div>

            <!-- ໂໝດເລກ (0-9) -->
            <div id="numberModeBox" class="mb-4">
                <div class="flex justify-between items-center mb-1">
                    <label class="text-sm text-slate-300">ເລືອກຕົວເລກ (ເລືອກໄດ້ 1 ເຖິງ 9 ໂຕ):</label>
                    <button onclick="clearSelection()" class="text-xs text-rose-400 hover:underline">ລ້າງຄ່າ</button>
                </div>
                <div class="grid grid-cols-5 gap-2" id="numberGrid">
                    <!-- ສ້າງປຸ່ມ 0-9 ດ້ວຍ JS -->
                </div>
                <p id="selectionCount" class="text-xs text-slate-400 mt-2">ເລືອກແລ້ວ: 0 ໂຕ</p>
            </div>

            <!-- ໂໝດພິເສດ (ຄູ່/ຄີ່, ສູງ/ຕ່ຳ) -->
            <div id="specialModeBox" class="mb-4 hidden">
                <label class="block text-sm text-slate-300 mb-2">ເລືອກປະເພດພິເສດ:</label>
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <button onclick="selectSpecial('even')" id="btnEven" class="bg-slate-700 py-2 rounded-lg text-sm font-bold border border-slate-600">ເລກຄູ່ (0,2,4,6,8)</button>
                    <button onclick="selectSpecial('odd')" id="btnOdd" class="bg-slate-700 py-2 rounded-lg text-sm font-bold border border-slate-600">ເລກຄີ່ (1,3,5,7,9)</button>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="selectSpecial('low')" id="btnLow" class="bg-slate-700 py-2 rounded-lg text-sm font-bold border border-slate-600">ຕ່ຳ (0-4)</button>
                    <button onclick="selectSpecial('high')" id="btnHigh" class="bg-slate-700 py-2 rounded-lg text-sm font-bold border border-slate-600">ສູງ (5-9)</button>
                </div>
            </div>

            <!-- ຈຳນວນເງິນເດີມພັນ -->
            <div class="mb-4">
                <label class="block text-sm text-slate-300 mb-1">ຈຳນວນເງິນເດີມພັນຕໍ່ 1 ສິດ (Kip):</label>
                <div class="grid grid-cols-5 gap-1 mb-2">
                    <button onclick="setBet(1000)" class="bg-slate-700 hover:bg-slate-600 text-xs py-1 rounded">1,000</button>
                    <button onclick="setBet(2000)" class="bg-slate-700 hover:bg-slate-600 text-xs py-1 rounded">2,000</button>
                    <button onclick="setBet(5000)" class="bg-slate-700 hover:bg-slate-600 text-xs py-1 rounded">5,000</button>
                    <button onclick="setBet(10000)" class="bg-slate-700 hover:bg-slate-600 text-xs py-1 rounded font-bold text-yellow-400">10,000</button>
                    <button onclick="setBet(20000)" class="bg-slate-700 hover:bg-slate-600 text-xs py-1 rounded">20,000</button>
                </div>
                <input type="number" id="betAmount" value="10000" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-yellow-400">
            </div>

            <!-- ປຸ່ມກົດຫຼິ້ນ -->
            <button onclick="playGame()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-bold py-3 rounded-xl shadow-lg transition text-lg">
                🎲 ກົດວາງເດີມພັນ 🎲
            </button>
        </div>

        <!-- ຂໍ້ມູນຕິດຕໍ່ແອດມິນ / เติมเงิน -->
        <div class="mt-8 border-t border-slate-700 pt-4 text-center">
            <p class="text-xs text-yellow-400 mb-2 font-bold">💰 ເຕີມເງິນ / ຕິດຕໍ່ແອດມິນ</p>
            <img src="qr.png" alt="QR Code" class="w-32 h-32 mx-auto rounded-lg mb-2 border border-slate-700 bg-white p-1">
            <p class="text-xs text-slate-400 mb-1">📞 ໂທ/WhatsApp: <strong class="text-white">020 9144 5369</strong></p>
            <a href="https://wa.me/8562091445369" target="_blank" class="inline-block mt-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition">
                💬 แจ້ງເຕີມເງິນຜ່ານ WhatsApp
            </a>
        </div>
    </div>

    <!-- Popup ສະແດງຜົນ -->
    <div id="popupModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl">
            <div id="popupIcon" class="text-5xl mb-2">🎉</div>
            <h3 id="popupTitle" class="text-xl font-bold mb-2">ຜົນການທາຍ</h3>
            <div id="popupMsg" class="text-sm text-slate-300 mb-4 space-y-1"></div>
            <button onclick="closePopup()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-bold py-2 rounded-xl transition">
                ຕົກລົງ / ລຸ້ນຕໍ່
            </button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "ໃສ່_URL_WebApp_ຂອງເຈົ້າບ່ອນນີ້"; // <--- ຢ່າລືມເອົາ Web App URL ມາໃສ່
        let currentPhone = "";
        let currentCredit = 0;
        let selectedNumbers = [];
        let currentMode = "number"; // number or special
        let selectedSpecialType = "";

        // ສ້າງປຸ່ມເລກ 0-9
        const numberGrid = document.getElementById("numberGrid");
        for (let i = 0; i <= 9; i++) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.innerText = i;
            btn.id = `num-btn-${i}`;
            btn.className = "bg-slate-700 hover:bg-slate-600 font-bold py-3 rounded-lg text-lg border border-slate-600 transition";
            btn.onclick = () => toggleNumber(i);
            numberGrid.appendChild(btn);
        }

        function setMode(mode) {
            currentMode = mode;
            if(mode === 'number') {
                document.getElementById("numberModeBox").classList.remove("hidden");
                document.getElementById("specialModeBox").classList.add("hidden");
                document.getElementById("modeNumBtn").className = "bg-yellow-500 text-slate-950 font-bold py-2 rounded-lg text-sm transition";
                document.getElementById("modeSpecBtn").className = "bg-slate-700 text-slate-300 font-bold py-2 rounded-lg text-sm transition";
            } else {
                document.getElementById("numberModeBox").classList.add("hidden");
                document.getElementById("specialModeBox").classList.remove("hidden");
                document.getElementById("modeSpecBtn").className = "bg-yellow-500 text-slate-950 font-bold py-2 rounded-lg text-sm transition";
                document.getElementById("modeNumBtn").className = "bg-slate-700 text-slate-300 font-bold py-2 rounded-lg text-sm transition";
            }
        }

        function toggleNumber(num) {
            const index = selectedNumbers.indexOf(num);
            if (index > -1) {
                selectedNumbers.splice(index, 1);
                document.getElementById(`num-btn-${num}`).className = "bg-slate-700 hover:bg-slate-600 font-bold py-3 rounded-lg text-lg border border-slate-600 transition";
            } else {
                if (selectedNumbers.length >= 9) {
                    alert("ເລືອກໄດ້ສູງສຸດພຽງ 9 ໂຕເລກເທົ່າກັນ!");
                    return;
                }
                selectedNumbers.push(num);
                document.getElementById(`num-btn-${num}`).className = "bg-yellow-500 text-slate-950 font-bold py-3 rounded-lg text-lg border border-yellow-400 transition";
            }
            document.getElementById("selectionCount").innerText = `ເລືອກແລ້ວ: ${selectedNumbers.length} ໂຕ`;
        }

        function clearSelection() {
            selectedNumbers = [];
            for (let i = 0; i <= 9; i++) {
                document.getElementById(`num-btn-${i}`).className = "bg-slate-700 hover:bg-slate-600 font-bold py-3 rounded-lg text-lg border border-slate-600 transition";
            }
            document.getElementById("selectionCount").innerText = "ເລືອກແລ້ວ: 0 ໂຕ";
        }

        function selectSpecial(type) {
            selectedSpecialType = type;
            ['even', 'odd', 'low', 'high'].forEach(t => {
                document.getElementById(`btn${t.charAt(0).toUpperCase() + t.slice(1)}`).className = "bg-slate-700 text-slate-300 py-2 rounded-lg text-sm font-bold border border-slate-600";
            });
            document.getElementById(`btn${type.charAt(0).toUpperCase() + type.slice(1)}`).className = "bg-yellow-500 text-slate-950 py-2 rounded-lg text-sm font-bold border border-yellow-400";
            
            // แปลg type ເປັນ set ຕົວເລກ
            if(type === 'even') selectedNumbers = [0, 2, 4, 6, 8];
            if(type === 'odd') selectedNumbers = [1, 3, 5, 7, 9];
            if(type === 'low') selectedNumbers = [0, 1, 2, 3, 4];
            if(type === 'high') selectedNumbers = [5, 6, 7, 8, 9];
        }

        function setBet(amount) {
            document.getElementById("betAmount").value = amount;
        }

        function loginUser() {
            const phone = document.getElementById("phoneInput").value.trim();
            if(!phone) { alert("ກະລຸນາປ້ອນເບີໂທກ່ອນ!"); return; }

            fetch(`${SCRIPT_URL}?phone=${phone}`)
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        currentPhone = phone;
                        currentCredit = data.credit;
                        document.getElementById("userPhoneDisplay").innerText = phone;
                        document.getElementById("userCredit").innerText = currentCredit.toLocaleString() + " ₭";
                        document.getElementById("loginSection").classList.add("hidden");
                        document.getElementById("gameSection").classList.remove("hidden");
                    } else {
                        alert("ບໍ່ພົບເບີໂທນີ້ໃນລະບົບ: " + data.error);
                    }
                })
                .catch(err => alert("ເຊື່ອມຕໍ່ Server ບໍ່ໄດ້: " + err));
        }

        function playGame() {
            if (selectedNumbers.length === 0) {
                alert("ກະລຸນາເລືອກຕົວເລກຢ່າງໜ້ອຍ 1 ໂຕ!");
                return;
            }
            const betAmountPerChoice = parseInt(document.getElementById('betAmount').value);
            if (isNaN(betAmountPerChoice) || betAmountPerChoice <= 0) {
                alert("ກະລຸນາໃສ່ຈຳນວນເງິນວາງພັນໃຫ້ຖືກຕ້ອງ!");
                return;
            }

            const totalBetAmount = betAmountPerChoice * selectedNumbers.length;
            if (totalBetAmount > currentCredit) {
                alert("ເຄຣດິດຂອງທ່ານບໍ່ພຽງພໍສຳລັບການເລືອກນີ້!");
                return;
            }

            const payload = {
                phone: currentPhone,
                chosenNumbers: selectedNumbers,
                betAmountPerChoice: betAmountPerChoice
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    currentCredit = data.newCredit;
                    document.getElementById('userCredit').innerText = currentCredit.toLocaleString() + " ₭";
                    showPopup(data.isWin, selectedNumbers, data.winningNumber, totalBetAmount, data.netWinAmount);
                } else {
                    alert("ຜິດພາດ: " + data.error);
                }
            })
            .catch(err => alert("ເຊື່ອມຕໍ່ Server ບໍ່ໄດ້: " + err));
        }

        function showPopup(isWin, chosen, winningNum, totalBet, netWin) {
            const modal = document.getElementById('popupModal');
            const icon = document.getElementById('popupIcon');
            const title = document.getElementById('popupTitle');
            const msg = document.getElementById('popupMsg');

            modal.classList.remove('hidden');
            if (isWin) {
                icon.innerHTML = "🎉";
                title.innerText = "ຍິນດີດ້ວຍ! ເຈົ້າຊະນະ!";
                title.className = "text-xl font-bold mb-2 text-emerald-400";
                msg.innerHTML = `ເລກທີ່ເຈົ້າເລືອກ: <strong>[${chosen.join(', ')}]</strong><br>` +
                                `ຜົນອອກເລກ: <strong class="text-yellow-400 text-xl">${winningNum}</strong><br>` +
                                `<span class="text-emerald-400 font-bold">ໄດ້ຮັບເງິນລາງວັນ: +${netWin.toLocaleString()} ₭</span>`;
            } else {
                icon.innerHTML = "😢";
                title.innerText = "ຂໍສະແດງຄວາມເສຍໃຈ";
                title.className = "text-xl font-bold mb-2 text-rose-400";
                msg.innerHTML = `ເລກທີ່ເຈົ້າເລືອກ: <strong>[${chosen.join(', ')}]</strong><br>` +
                                `ຜົນອອກເລກ: <strong class="text-yellow-400 text-xl">${winningNum}</strong><br>` +
                                `<span class="text-rose-400 font-bold">ຜິດຫວັງ, ເສຍເງິນ: -${totalBet.toLocaleString()} ₭</span>`;
            }
        }

        function closePopup() {
            document.getElementById('popupModal').classList.add('hidden');
        }
    </script>
</body>
</html>

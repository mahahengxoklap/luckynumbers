<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ເກມທາຍຕົວເລກ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Lao', sans-serif; background-color: #0f172a; color: white; }
        .number-btn { transition: all 0.2s ease; }
        .number-btn.selected { background-color: #eab308; color: #000; transform: scale(1.05); box-shadow: 0 0 15px rgba(234, 179, 8, 0.6); }
        .amount-btn { transition: all 0.15s ease; }
        .amount-btn.active-amount { background-color: #eab308; color: #000; border-color: #eab308; font-weight: bold; }
        
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        .money-drop {
            position: fixed;
            top: -50px;
            font-size: 24px;
            animation: fall linear infinite;
            z-index: 99;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700 mb-10">
        <h1 class="text-2xl font-bold text-center mb-2 text-yellow-400">🎲 ເກມທາຍຕົວເລກ 🎲</h1>
        <p class="text-center text-slate-400 text-sm mb-6">ເລືອກເລກ 1 ໂຕ (0-9) ແລ້ວລຸ້ນຮັບໂຊກ 5 ເທົ່າ!</p>

        <!-- User Info / Credit -->
        <div class="bg-slate-900 rounded-xl p-4 mb-6 flex justify-between items-center border border-slate-700">
            <div>
                <p class="text-xs text-slate-400">ເບີໂທລະສັບ:</p>
                <p id="userPhone" class="font-bold text-lg text-emerald-400">-</p>
            </div>
            <div class="text-right">
                <p class="text-xs text-slate-400">ເຄຣດິດຄົງເຫຼືອ:</p>
                <p id="userCredit" class="font-bold text-xl text-yellow-400">0 ₭</p>
            </div>
        </div>

        <!-- Phone Login Section -->
        <div id="loginSection" class="mb-6 bg-slate-900 p-4 rounded-xl border border-slate-700">
            <label class="block text-xs text-slate-400 mb-1">ປ້ອນເບີໂທເພື່ອເຂົ້າຫຼິ້ນ:</label>
            <div class="flex gap-2">
                <input type="text" id="phoneInput" placeholder="ເຊັ່ນ: 99677819" class="flex-1 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-yellow-400">
                <button onclick="loadUser()" class="bg-yellow-500 hover:bg-yellow-600 text-slate-900 font-bold px-4 py-2 rounded-lg transition">ເຂົ້າສູ່ລະບົບ</button>
            </div>
        </div>

        <!-- Game Section -->
        <div id="gameSection" class="opacity-50 pointer-events-none transition-all">
            <label class="block text-sm font-semibold mb-2 text-slate-300">ເລືອກຕົວເລກ (ເລືອກໄດ້ 1 ໂຕ):</label>
            <div class="grid grid-cols-5 gap-3 mb-6">
                <button onclick="selectNumber(0)" class="number-btn bg-slate-700 hover:bg-slate-600 font-bold py-3 rounded-xl text-xl" data-num="0">0</button>
                <button onclick="selectNumber(1)" class="number-btn bg-slate-700 hover:bg-slate-600 font-bold py-3 rounded-xl text-xl" data-num="1">1</button>
                <button onclick="selectNumber(2)" class="number-btn bg-slate-700 hover:bg-slate-600 font-bold py-3 rounded-xl text-xl" data-num="2">2</button>
                <button onclick="selectNumber(3)" class="number-btn bg-slate-700 hover:bg-slate-600 font-bold py-3 rounded-xl text-xl" data-num="3">3</button>
                <button onclick="selectNumber(4)" class="number-btn bg-slate-700 hover:bg-slate-600 font-bold py-3 rounded-xl text-xl" data-num="4">4</button>
                <button onclick="selectNumber(5)" class="number-btn bg-slate-700 hover:bg-slate-600 font-bold py-3 rounded-xl text-xl" data-num="5">5</button>
                <button onclick="selectNumber(6)" class="number-btn bg-slate-700 hover:bg-slate-600 font-bold py-3 rounded-xl text-xl" data-num="6">6</button>
                <button onclick="selectNumber(7)" class="number-btn bg-slate-700 hover:bg-slate-600 font-bold py-3 rounded-xl text-xl" data-num="7">7</button>
                <button onclick="selectNumber(8)" class="number-btn bg-slate-700 hover:bg-slate-600 font-bold py-3 rounded-xl text-xl" data-num="8">8</button>
                <button onclick="selectNumber(9)" class="number-btn bg-slate-700 hover:bg-slate-600 font-bold py-3 rounded-xl text-xl" data-num="9">9</button>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-semibold mb-2 text-slate-300">ຈຳນວນເງິນວາງພັນ (Kip):</label>
                <div class="grid grid-cols-5 gap-2 mb-3">
                    <button type="button" onclick="setBetAmount(1000)" class="amount-btn bg-slate-700 hover:bg-slate-600 text-xs font-bold py-2 rounded-lg border border-slate-600" data-amount="1000">1,000</button>
                    <button type="button" onclick="setBetAmount(2000)" class="amount-btn bg-slate-700 hover:bg-slate-600 text-xs font-bold py-2 rounded-lg border border-slate-600" data-amount="2000">2,000</button>
                    <button type="button" onclick="setBetAmount(5000)" class="amount-btn bg-slate-700 hover:bg-slate-600 text-xs font-bold py-2 rounded-lg border border-slate-600" data-amount="5000">5,000</button>
                    <button type="button" onclick="setBetAmount(10000)" class="amount-btn bg-slate-700 hover:bg-slate-600 text-xs font-bold py-2 rounded-lg border border-slate-600" data-amount="10000">10,000</button>
                    <button type="button" onclick="setBetAmount(20000)" class="amount-btn bg-slate-700 hover:bg-slate-600 text-xs font-bold py-2 rounded-lg border border-slate-600" data-amount="20000">20,000</button>
                </div>
                <input type="number" id="betAmount" value="10000" oninput="checkCustomAmount()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-lg font-bold focus:outline-none focus:border-yellow-400">
            </div>

            <button onclick="playGame()" id="playBtn" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-extrabold py-4 rounded-xl text-lg shadow-lg transition transform active:scale-95 mb-6">
                🎲 ກົດວາງເດີມພັນ 🎲
            </button>
        </div>

        <!-- 💰 ເຕີມເງິນ / ຕິດຕໍ່ແອດມິນ -->
        <div class="bg-slate-900 p-5 rounded-2xl border border-slate-700 text-center mb-4 shadow-inner">
            <h2 class="text-yellow-400 font-bold text-lg mb-1 flex items-center justify-center gap-2">
                <span>💰</span> ເຕີມເງິນ / ຕິດຕໍ່ແອດມິນ
            </h2>
            <p class="text-xs text-slate-300 mb-4">ສະແກນ QR ໂອນເງິນ (Lao QR) ແລ້ວສົ່ງສລິບໃຫ້ແອດມິນ</p>
            
            <div class="bg-white p-3 rounded-xl inline-block shadow-md mb-4">
                <img src="qr.png" alt="Lao QR Code" class="w-48 h-48 mx-auto object-contain">
            </div>

            <p class="text-xs text-slate-400 mb-1">📞 ໂທ/WhatsApp ຕິດຕໍ່:</p>
            <a href="https://wa.me/8562091445369?text=ສະບາຍດີແອດມິນ, ຂ້ອຍໂອນເງິນແລ້ວ ແຄັບຍອດມາແຈ້ງ ຂໍສະໝັກສະມາຊິກແດ່" target="_blank" class="text-emerald-400 font-extrabold text-xl hover:underline block mb-4">
                020 9144 5369
            </a>

            <a href="https://wa.me/8562091445369?text=ສະບາຍດີແອດມິນ, ຂ້ອຍໂອນເງິນແລ້ວ ແຄັບຍອດມາແຈ້ງ ຂໍສະໝັກສະມາຊິກແດ່" target="_blank" class="flex items-center justify-center gap-2 w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold py-3.5 px-4 rounded-xl transition shadow-lg text-base">
                <span>💬</span> ແຈ້ງເຕີມເງິນຜ່ານ WhatsApp
            </a>
        </div>
    </div>

    <!-- POPUP MODAL -->
    <div id="popupModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl transform transition-all scale-95" id="popupContent">
            <div id="popupIcon" class="text-5xl mb-3">🎉</div>
            <h3 id="popupTitle" class="text-2xl font-bold mb-2 text-yellow-400">ຂໍສະແດງຄວາມຍິນດີ!</h3>
            <p id="popupMessage" class="text-slate-300 text-sm mb-6 leading-relaxed">ລາຍລະອຽດຜົນການອອກເລກ...</p>
            <button onclick="closePopup()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-bold py-3 rounded-xl text-base transition shadow-lg">
                ຕົກລົງ / ລຸ້ນຕໍ່
            </button>
        </div>
    </div>

    <script>
        // 🔗 ໃຊ້ URL ໃໝ່ທີ່ໄດ້ຈາກການ Deploy ຫຼ້າສຸດ
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyk2kPrMrIj5TvZG23LUx92MDt7WwFNsYsnCquYq2pVa6zi_KtJcPrA42m6a2R-lqYg/exec";
        
        let currentPhone = "";
        let currentCredit = 0;
        let selectedNum = null;

        function setBetAmount(amount) {
            document.getElementById('betAmount').value = amount;
            updateAmountButtons(amount);
        }

        function checkCustomAmount() {
            const val = parseInt(document.getElementById('betAmount').value);
            updateAmountButtons(val);
        }

        function updateAmountButtons(val) {
            document.querySelectorAll('.amount-btn').forEach(btn => {
                if (parseInt(btn.dataset.amount) === val) {
                    btn.classList.add('active-amount');
                } else {
                    btn.classList.remove('active-amount');
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateAmountButtons(10000);
        });

        function loadUser() {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!phone) {
                alert("ກະລຸນາປ້ອນເບີໂທລະສັບ!");
                return;
            }

            fetch(`${SCRIPT_URL}?phone=${phone}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        currentPhone = phone;
                        currentCredit = data.credit;
                        document.getElementById('userPhone').innerText = phone;
                        document.getElementById('userCredit').innerText = currentCredit.toLocaleString() + " ₭";
                        document.getElementById('loginSection').style.display = 'none';
                        document.getElementById('gameSection').classList.remove('opacity-50', 'pointer-events-none');
                    } else {
                        alert("ບໍ່ພົບເບີໂທນີ້ໃນລະບົບ: " + (data.message || "ກວດສອບເບີຄືນ"));
                    }
                })
                .catch(err => {
                    alert("ເກີດຂໍ້ຜິດພາດໃນການເຊື່ອມຕໍ່: " + err);
                });
        }

        function selectNumber(num) {
            selectedNum = num;
            document.querySelectorAll('.number-btn').forEach(btn => {
                if (parseInt(btn.dataset.num) === num) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });
        }

        function playGame() {
            if (selectedNum === null) {
                alert("ກະລຸນາເລືອກຕົວເລກກ່ອນ!");
                return;
            }
            const betAmount = parseInt(document.getElementById('betAmount').value);
            if (isNaN(betAmount) || betAmount <= 0) {
                alert("ກະລຸນາໃສ່ຈຳນວນເງິນວາງພັນໃຫ້ຖືກຕ້ອງ!");
                return;
            }
            if (betAmount > currentCredit) {
                alert("ເຄຣດິດຂອງທ່ານບໍ່ພຽງພໍ!");
                return;
            }

            const payload = {
                phone: currentPhone,
                chosenNumber: selectedNum,
                betAmount: betAmount
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    currentCredit = data.newCredit;
                    document.getElementById('userCredit').innerText = currentCredit.toLocaleString() + " ₭";
                    showPopup(data.isWin, selectedNum, data.winningNumber, betAmount, data.netWinAmount || (betAmount * 5));
                } else {
                    alert("ຜິດພາດ: " + (data.error || "ບໍ່ทราบສາເຫດ"));
                }
            })
            .catch(err => {
                alert("ເຊື່ອມຕໍ່ Server ບໍ່ໄດ້: " + err);
            });
        }

        function showPopup(isWin, chosen, winning, bet, winAmount) {
            const modal = document.getElementById('popupModal');
            const icon = document.getElementById('popupIcon');
            const title = document.getElementById('popupTitle');
            const msg = document.getElementById('popupMessage');

            modal.classList.remove('hidden');

            if (isWin) {
                icon.innerHTML = "🎉💰🥳";
                title.innerText = "ຂໍສະແດງຄວາມຍິນດີ!";
                title.className = "text-2xl font-bold mb-2 text-emerald-400";
                msg.innerHTML = `ເຈົ້າເລືອກເລກ: <strong class="text-white text-lg">${chosen}</strong><br>` +
                                `ຜົນອອກເລກ: <strong class="text-yellow-400 text-xl">${winning}</strong><br>` +
                                `<span class="text-emerald-400 font-bold text-lg">ຖືກລາງວັນ! ຮັບເງິນ: +${winAmount.toLocaleString()} ₭</span>`;
                startMoneyRain();
            } else {
                icon.innerHTML = "😢❌";
                title.innerText = "ຂໍສະແດງຄວາມເສຍໃຈ";
                title.className = "text-2xl font-bold mb-2 text-rose-400";
                msg.innerHTML = `ເຈົ້າເລືອກເລກ: <strong class="text-white text-lg">${chosen}</strong><br>` +
                                `ຜົນອອກເລກ: <strong class="text-yellow-400 text-xl">${winning}</strong><br>` +
                                `<span class="text-rose-400 font-bold">ຜິດຫວັງ, ເສຍເງິນ: -${bet.toLocaleString()} ₭</span>`;
            }
        }

        function closePopup() {
            document.getElementById('popupModal').classList.add('hidden');
            document.querySelectorAll('.money-drop').forEach(el => el.remove());
        }

        function startMoneyRain() {
            for (let i = 0; i < 25; i++) {
                const drop = document.createElement('div');
                drop.className = 'money-drop';
                drop.innerText = ['💵', '💰', '💸', '🪙'][Math.floor(Math.random() * 4)];
                drop.style.left = Math.random() * 100 + 'vw';
                drop.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                drop.style.animationDelay = (Math.random() * 0.5) + 's';
                document.body.appendChild(drop);
            }
        }
    </script>
</body>
</html>

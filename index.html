<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ເກມທາຍຕົວເລກ - Lucky Numbers</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-2xl max-w-md w-full">
        <h1 class="text-2xl font-bold text-center mb-1 text-yellow-400">🎲 ເກມທາຍຕົວເລກ 🎲</h1>
        <p class="text-xs text-center text-slate-400 mb-6">ເລືອກເລກດ່ຽວ ຫຼື ຫຼິ້ນໂໝດ ຄູ່/ຄີ່ ສູງ/ຕ່ຳ ໄດ້!</p>

        <!-- ຂໍ້ມູນຢູເຊີ ແລະ ເຄຣດິດ -->
        <div class="bg-slate-900 p-4 rounded-xl mb-4 flex justify-between items-center border border-slate-700">
            <div>
                <p class="text-xs text-slate-400">ເບີໂທລະສັບ:</p>
                <p id="userPhoneDisplay" class="text-emerald-400 font-bold text-lg">-</p>
            </div>
            <div class="text-right">
                <p class="text-xs text-slate-400">ເຄຣດິດຄົງເຫຼືອ:</p>
                <p id="userCredit" class="text-yellow-400 font-bold text-xl">0 ₭</p>
            </div>
        </div>

        <!-- ຟອມເຂົ້າສູ່ລະບົບ -->
        <div id="loginSection" class="mb-6">
            <label class="block text-sm text-slate-300 mb-1">ປ້ອນເບີໂທເພື່ອເຂົ້າສູ່ລະບົບ:</label>
            <div class="flex gap-2">
                <input type="text" id="phoneInput" placeholder="ຕົວຢ່າງ: 2099123456" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-yellow-400">
                <button onclick="loginUser()" class="bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-bold px-4 py-2 rounded-lg transition">ເຂົ້າສູ່ລະບົບ</button>
            </div>
        </div>

        <!-- ເກມ -->
        <div id="gameSection" class="hidden">
            
            <!-- ເລືອກໂໝດ -->
            <div class="mb-4">
                <label class="block text-sm text-slate-300 mb-2">ເລືອກປະເພດການທາຍ:</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="setMode('number')" id="modeNumBtn" class="bg-yellow-500 text-slate-950 font-bold py-2 rounded-lg text-sm transition">🔢 ຕິກເລືອກເລກ (0-9)</button>
                    <button type="button" onclick="setMode('special')" id="modeSpecBtn" class="bg-slate-700 text-slate-300 font-bold py-2 rounded-lg text-sm transition">⚡ ຄູ່/ຄີ່ ສູງ/ຕ່ຳ</button>
                </div>
            </div>

            <!-- ໂໝດເລກ (0-9) -->
            <div id="numberModeBox" class="mb-4">
                <div class="flex justify-between items-center mb-1">
                    <label class="text-sm text-slate-300">ເລືອກຕົວເລກ (ເລືອກໄດ້ຫຼາຍໂຕ):</label>
                    <button type="button" onclick="clearSelection()" class="text-xs text-rose-400 hover:underline">ລ້າງຄ່າ</button>
                </div>
                <div class="grid grid-cols-5 gap-2" id="numberGrid"></div>
                <p id="selectionCount" class="text-xs text-slate-400 mt-2">ເລືອກແລ້ວ: 0 ໂຕ</p>
            </div>

            <!-- ໂໝດພິເສດ (ຄູ່/ຄີ່, ສູງ/ຕ່ຳ) -->
            <div id="specialModeBox" class="mb-4 hidden">
                <label class="block text-sm text-slate-300 mb-2">ເລືອກປະເພດ (ລົງປຸ່ມດຽວ):</label>
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <button type="button" onclick="selectSpecial('even')" id="btn-even" class="bg-slate-700 text-slate-300 py-3 rounded-lg text-sm font-bold border border-slate-600 hover:border-yellow-400 transition">ເລກຄູ່ (0,2,4,6,8)</button>
                    <button type="button" onclick="selectSpecial('odd')" id="btn-odd" class="bg-slate-700 text-slate-300 py-3 rounded-lg text-sm font-bold border border-slate-600 hover:border-yellow-400 transition">ເລກຄີ່ (1,3,5,7,9)</button>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="selectSpecial('low')" id="btn-low" class="bg-slate-700 text-slate-300 py-3 rounded-lg text-sm font-bold border border-slate-600 hover:border-yellow-400 transition">ຕ່ຳ (0,1,2,3,4)</button>
                    <button type="button" onclick="selectSpecial('high')" id="btn-high" class="bg-slate-700 text-slate-300 py-3 rounded-lg text-sm font-bold border border-slate-600 hover:border-yellow-400 transition">ສູງ (5,6,7,8,9)</button>
                </div>
                <p id="specialSelectionDisplay" class="text-xs text-yellow-400 mt-2 text-center font-bold">ຍັງບໍ່ໄດ້ເລືອກປະເພດ</p>
            </div>

            <!-- ຈຳນວນເງິນເດີມພັນ -->
            <div class="mb-4">
                <label class="block text-sm text-slate-300 mb-1" id="betLabel">ຈຳນວນເງິນເດີມພັນຕໍ່ 1 ໂຕ (Kip):</label>
                <div class="grid grid-cols-5 gap-1 mb-2">
                    <button type="button" onclick="setBet(1000)" class="bg-slate-700 hover:bg-slate-600 text-xs py-1 rounded">1,000</button>
                    <button type="button" onclick="setBet(5000)" class="bg-slate-700 hover:bg-slate-600 text-xs py-1 rounded">5,000</button>
                    <button type="button" onclick="setBet(10000)" class="bg-slate-700 hover:bg-slate-600 text-xs py-1 rounded font-bold text-yellow-400">10,000</button>
                    <button type="button" onclick="setBet(20000)" class="bg-slate-700 hover:bg-slate-600 text-xs py-1 rounded">20,000</button>
                    <button type="button" onclick="setBet(50000)" class="bg-slate-700 hover:bg-slate-600 text-xs py-1 rounded">50,000</button>
                </div>
                <input type="number" id="betAmount" value="10000" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-yellow-400">
            </div>

            <!-- ປຸ່ມກົດຫຼິ້ນ -->
            <button type="button" onclick="playGame()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-bold py-3 rounded-xl shadow-lg transition text-lg">
                🎲 ກົດວາງເດີມພັນ 🎲
            </button>
        </div>

        <!-- ຂໍ້ມູນຕິດຕໍ່ -->
        <div class="mt-8 border-t border-slate-700 pt-4 text-center">
            <p class="text-xs text-yellow-400 mb-2 font-bold">💰 ເຕີມເງິນ / ຕິດຕໍ່ແອດມິນ</p>
            <img src="qr.png" alt="QR Code" class="w-32 h-32 mx-auto rounded-lg mb-2 border border-slate-700 bg-white p-1">
            <p class="text-xs text-slate-400 mb-1">📞 ໂທ/WhatsApp: <strong class="text-white">020 9144 5369</strong></p>
            <a href="https://wa.me/8562091445369" target="_blank" class="inline-block mt-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition">
                💬 ແຈ້ງເຕີມເງິນຜ່ານ WhatsApp
            </a>
        </div>
    </div>

    <!-- Popup ສະແດງຜົນ -->
    <div id="popupModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl">
            <div id="popupIcon" class="text-5xl mb-2">🎉</div>
            <h3 id="popupTitle" class="text-xl font-bold mb-2">ຜົນການທາຍ</h3>
            <div id="popupMsg" class="text-sm text-slate-300 mb-4 space-y-1"></div>
            <button type="button" onclick="closePopup()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-bold py-2 rounded-xl transition">
                ຕົກລົງ / ລຸ້ນຕໍ່
            </button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyk2kPrMrIj5TvZG23LUx92MDt7WwFNsYsnCquYq2pVa6zi_KtJcPrA42m6a2R-lqYg/exec";
        let currentPhone = "";
        let currentCredit = 0;
        let currentMode = "number"; // 'number' ຫຼື 'special'
        let selectedNumbers = [];
        let selectedSpecialChoice = "";

        const numberGrid = document.getElementById("numberGrid");
        for (let i = 0; i <= 9; i++) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.innerText = i;
            btn.id = `num-btn-${i}`;
            btn.className = "bg-slate-700 hover:bg-slate-600 font-bold py-3 rounded-lg text-lg border border-slate-600 transition";
            btn.onclick = () => toggleNumber(i);
            numberGrid.appendChild(btn);
        }

        function setMode(mode) {
            currentMode = mode;
            if(mode === 'number') {
                document.getElementById("numberModeBox").classList.remove("hidden");
                document.getElementById("specialModeBox").classList.add("hidden");
                document.getElementById("modeNumBtn").className = "bg-yellow-500 text-slate-950 font-bold py-2 rounded-lg text-sm transition";
                document.getElementById("modeSpecBtn").className = "bg-slate-700 text-slate-300 font-bold py-2 rounded-lg text-sm transition";
                document.getElementById("betLabel").innerText = "ຈຳນວນເງິນເດີມພັນຕໍ່ 1 ໂຕ (Kip):";
            } else {
                document.getElementById("numberModeBox").classList.add("hidden");
                document.getElementById("specialModeBox").classList.remove("hidden");
                document.getElementById("modeSpecBtn").className = "bg-yellow-500 text-slate-950 font-bold py-2 rounded-lg text-sm transition";
                document.getElementById("modeNumBtn").className = "bg-slate-700 text-slate-300 font-bold py-2 rounded-lg text-sm transition";
                document.getElementById("betLabel").innerText = "ຈຳນວນເງິນເດີມພັນລວມ (Kip):";
            }
        }

        function toggleNumber(num) {
            const index = selectedNumbers.indexOf(num);
            if (index > -1) {
                selectedNumbers.splice(index, 1);
                document.getElementById(`num-btn-${num}`).className = "bg-slate-700 hover:bg-slate-600 font-bold py-3 rounded-lg text-lg border border-slate-600 transition";
            } else {
                selectedNumbers.push(num);
                document.getElementById(`num-btn-${num}`).className = "bg-yellow-500 text-slate-950 font-bold py-3 rounded-lg text-lg border border-yellow-400 transition";
            }
            document.getElementById("selectionCount").innerText = `ເລືອກແລ້ວ: ${selectedNumbers.length} ໂຕ`;
        }

        function clearSelection() {
            selectedNumbers = [];
            for (let i = 0; i <= 9; i++) {
                document.getElementById(`num-btn-${i}`).className = "bg-slate-700 hover:bg-slate-600 font-bold py-3 rounded-lg text-lg border border-slate-600 transition";
            }
            document.getElementById("selectionCount").innerText = "ເລືອກແລ້ວ: 0 ໂຕ";
        }

        function selectSpecial(choice) {
            selectedSpecialChoice = choice;
            ['even', 'odd', 'low', 'high'].forEach(c => {
                document.getElementById(`btn-${c}`).className = "bg-slate-700 text-slate-300 py-3 rounded-lg text-sm font-bold border border-slate-600 transition";
            });
            document.getElementById(`btn-${choice}`).className = "bg-yellow-500 text-slate-950 py-3 rounded-lg text-sm font-bold border border-yellow-400 transition";
            
            let desc = "";
            if(choice === 'even') desc = "ເລືອກ: ເລກຄູ່ (0, 2, 4, 6, 8)";
            if(choice === 'odd') desc = "ເລືອກ: ເລກຄີ່ (1, 3, 5, 7, 9)";
            if(choice === 'low') desc = "ເລືອກ: ຕ່ຳ (0, 1, 2, 3, 4)";
            if(choice === 'high') desc = "ເລືອກ: ສູງ (5, 6, 7, 8, 9)";
            document.getElementById("specialSelectionDisplay").innerText = desc;
        }

        function setBet(amount) {
            document.getElementById("betAmount").value = amount;
        }

        function loginUser() {
            const phone = document.getElementById("phoneInput").value.trim();
            if(!phone) { alert("ກະລຸນາປ້ອນເບີໂທກ່ອນ!"); return; }

            fetch(`${SCRIPT_URL}?phone=${phone}`)
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        currentPhone = phone;
                        currentCredit = data.credit;
                        document.getElementById("userPhoneDisplay").innerText = phone;
                        document.getElementById("userCredit").innerText = currentCredit.toLocaleString() + " ₭";
                        document.getElementById("loginSection").classList.add("hidden");
                        document.getElementById("gameSection").classList.remove("hidden");
                    } else {
                        alert("ບໍ່ພົບເບີໂທນີ້ໃນລະບົບ: " + data.error);
                    }
                })
                .catch(err => alert("ເຊື່ອມຕໍ່ Server ບໍ່ໄດ້: " + err));
        }

        function playGame() {
            const betAmount = parseInt(document.getElementById('betAmount').value);
            if (isNaN(betAmount) || betAmount <= 0) {
                alert("ກະລຸນາໃສ່ຈຳນວນເງິນວາງພັນໃຫ້ຖືກຕ້ອງ!");
                return;
            }

            let payload = {
                phone: currentPhone,
                playMode: currentMode,
                betAmount: betAmount
            };

            if (currentMode === 'number') {
                if (selectedNumbers.length === 0) {
                    alert("ກະລຸນາເລືອກຕົວເລກຢ່າງໜ້ອຍ 1 ໂຕ!");
                    return;
                }
                payload.choice = selectedNumbers;
            } else {
                if (!selectedSpecialChoice) {
                    alert("ກະລຸນາເລືອກປະເພດ (ຄູ່/ຄີ່ ຫຼື ສູງ/ຕ່ຳ) ກ່ອນ!");
                    return;
                }
                payload.choice = selectedSpecialChoice;
            }

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    currentCredit = data.newCredit;
                    document.getElementById('userCredit').innerText = currentCredit.toLocaleString() + " ₭";
                    showPopup(data.isWin, data.winningNumber, data.totalBetAmount, data.netWinAmount);
                } else {
                    alert("ຜິດພາດ: " + data.error);
                }
            })
            .catch(err => alert("ເຊື່ອມຕໍ່ Server ບໍ່ໄດ້: " + err));
        }

        function showPopup(isWin, winningNum, totalBet, netWin) {
            const modal = document.getElementById('popupModal');
            const icon = document.getElementById('popupIcon');
            const title = document.getElementById('popupTitle');
            const msg = document.getElementById('popupMsg');

            modal.classList.remove('hidden');
            if (isWin) {
                icon.innerHTML = "🎉";
                title.innerText = "ຍິນດີດ້ວຍ! ເຈົ້າຊະນະ!";
                title.className = "text-xl font-bold mb-2 text-emerald-400";
                msg.innerHTML = `ຜົນອອກເລກ: <strong class="text-yellow-400 text-2xl">${winningNum}</strong><br>` +
                                `ຍອດເດີມພັນລວມ: ${totalBet.toLocaleString()} ₭<br>` +
                                `<span class="text-emerald-400 font-bold text-base">ໄດ້ຮັບເງິນລາງວັນລວມ: +${netWin.toLocaleString()} ₭</span>`;
            } else {
                icon.innerHTML = "😢";
                title.innerText = "ຂໍສະແດງຄວາມເສຍໃຈ";
                title.className = "text-xl font-bold mb-2 text-rose-400";
                msg.innerHTML = `ຜົນອອກເລກ: <strong class="text-yellow-400 text-2xl">${winningNum}</strong><br>` +
                                `ຍອດເດີມພັນລວມ: ${totalBet.toLocaleString()} ₭<br>` +
                                `<span class="text-rose-400 font-bold text-base">ເສຍເງິນ: -${totalBet.toLocaleString()} ₭</span>`;
            }
        }

        function closePopup() {
            document.getElementById('popupModal').classList.add('hidden');
        }
    </script>
</body>
</html>
